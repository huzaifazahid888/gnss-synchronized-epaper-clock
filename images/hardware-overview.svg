<path d="M410 249 H480 V315 H563" class="line-u" marker-end="url(#arr-u)"/><text x="438" y="226" font-family="Arial" font-size="20" fill="#3975b4" font-weight="bold">UART</text>
<path d="M410 453 H470 V423 H563" class="line-i" marker-end="url(#arr-i)"/><text x="438" y="473" font-family="Arial" font-size="20" fill="#26916c" font-weight="bold">I2C</text>
<path d="M814 358 H974" class="line-s" marker-end="url(#arr-s)"/><text x="875" y="337" font-family="Arial" font-size="20" fill="#c07727" font-weight="bold">SPI</text>
