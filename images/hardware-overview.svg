<rect x="60" y="690" width="1277" height="67" rx="11" fill="#e6edf5"/>
<text x="82" y="717" class="mono">GNSS TX → GPIO27</text><text x="395" y="717" class="mono">RTC SDA → GPIO21</text><text x="733" y="717" class="mono">RTC SCL → GPIO22</text>
<text x="82" y="742" class="mono">EPD CS 5 / DC 17 / RST 16 / BUSY 4</text><text x="660" y="742" class="mono">SPI SCK 18 / MOSI 23 (default VSPI)</text>
