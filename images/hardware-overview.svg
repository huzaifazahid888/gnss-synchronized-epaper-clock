<rect x="523" y="580" width="343" height="93" rx="13" class="card"/><rect x="551" y="606" width="48" height="36" rx="7" fill="#7ec8a1" stroke="#2d8260" stroke-width="3"/><rect x="599" y="616" width="7" height="17" fill="#2d8260"/><text x="623" y="616" class="h">18650 Li-ion cell</text><text x="623" y="645" class="small">board battery holder</text><path d="M692 580 V547" class="line-p"/>
