<rect x="1013" y="317" width="287" height="142" rx="6" fill="#1e2530"/><rect x="1028" y="332" width="257" height="114" fill="#f3f1eb" stroke="#b5bac2" stroke-width="4"/>
<text x="1046" y="360" font-family="monospace" font-size="15" fill="#29323c">GPS:FIX 10  UTC+5</text><line x1="1041" y1="372" x2="1272" y2="372" stroke="#43505d" stroke-width="2"/><text x="1064" y="419" font-family="Arial" font-size="46" font-weight="bold" fill="#29323c">18:26</text><text x="1154" y="491" text-anchor="middle" class="h">2.9-inch e-paper</text><text x="1154" y="517" text-anchor="middle" class="small">296 × 128, monochrome</text>
